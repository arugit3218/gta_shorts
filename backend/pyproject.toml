[project]
name = "clipstudio"
version = "0.1.0"
description = "Local-first AI video clipping studio"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "python-multipart",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "numpy>=2.2.5",
    "opencv-python-headless==5.1.0.95",
    "psutil==7.2.2",
    "yt-dlp==2026.10.26",
    "yt-dlp-ejs==0.8.0",
    "parakeet-mlx==0.7.0",
    "pillow>=11",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipstudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: uses the real speech model (~20 s)"]
